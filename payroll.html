<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#004499">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Payroll — HRIS PT KMA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <script src="hris-shared.js"></script>
  <script src="notify.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --primary:#1d4ed8; --primary-dk:#1e3a8a; --sidebar-w:240px; --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --radius:12px; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    .sidebar { position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w); background:var(--primary-dk); color:white; display:flex; flex-direction:column; z-index:100; }
    .sidebar-brand { padding:1.25rem; border-bottom:1px solid rgba(255,255,255,.08); }
    .logo-row { display:flex; align-items:center; gap:.6rem; }
    .logo-icon { width:36px; height:36px; background:rgba(255,255,255,.12); border-radius:10px; display:grid; place-items:center; font-size:1.1rem; }
    .logo-text { font-size:.82rem; font-weight:700; line-height:1.3; }
    .logo-sub  { font-size:.68rem; opacity:.5; }
    .sidebar-nav { flex:1; overflow-y:auto; padding:.75rem 0; }
    .nav-label { font-size:.65rem; font-weight:600; letter-spacing:1px; text-transform:uppercase; opacity:.4; padding:.75rem 1.25rem .4rem; }
    .nav-item { display:flex; align-items:center; gap:.75rem; padding:.65rem 1.25rem; font-size:.875rem; font-weight:500; color:rgba(255,255,255,.7); text-decoration:none; cursor:pointer; transition:background .15s; position:relative; }
    .nav-item:hover { background:rgba(255,255,255,.07); color:white; }
    .nav-item.active { background:rgba(255,255,255,.12); color:white; }
    .nav-item.active::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:#60a5fa; border-radius:0 2px 2px 0; }
    .nav-icon { font-size:1rem; width:20px; text-align:center; }
    .soon { margin-left:auto; font-size:.62rem; background:rgba(255,255,255,.08); padding:1px 6px; border-radius:4px; opacity:.6; }
    .sidebar-footer { padding:1rem 1.25rem; border-top:1px solid rgba(255,255,255,.08); }
    .sidebar-user { display:flex; align-items:center; gap:.7rem; }
    .s-av { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.15); display:grid; place-items:center; font-size:.9rem; font-weight:600; }
    .u-name { font-size:.82rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u-role { font-size:.7rem; opacity:.5; }
    .btn-lo { background:none; border:none; color:rgba(255,255,255,.4); cursor:pointer; font-size:1rem; }
    .btn-lo:hover { color:#f87171; }

    .main-wrap { margin-left:var(--sidebar-w); min-height:100vh; display:flex; flex-direction:column; }
    .top-bar { height:64px; background:white; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 1.75rem; position:sticky; top:0; z-index:50; }
    .top-bar h1 { font-size:1.1rem; font-weight:700; }
    .bc { font-size:.75rem; color:var(--muted); }
    .main { flex:1; padding:1.75rem; }

    .card { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); }
    .card-head { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom:1px solid var(--border); }
    .card-head h3 { font-size:.9rem; font-weight:700; }
    .card-body { padding:1.25rem; }

    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.25rem; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.25rem; }
    .stat-label { font-size:.75rem; color:var(--muted); font-weight:600; margin-bottom:.4rem; }
    .stat-val { font-size:1.4rem; font-weight:800; }
    .stat-sub { font-size:.72rem; color:var(--muted); margin-top:.2rem; }
    .c-blue{color:#2563eb;} .c-green{color:#16a34a;} .c-yellow{color:#d97706;} .c-purple{color:#7c3aed;}

    .tbl-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.875rem; }
    th { padding:.65rem 1rem; text-align:left; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); background:#f8fafc; border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:.75rem 1rem; border-bottom:1px solid var(--border); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#fafafa; }
    .empty-row td { text-align:center; padding:2rem; color:var(--muted); }

    .badge { display:inline-flex; align-items:center; padding:2px 10px; border-radius:99px; font-size:.72rem; font-weight:700; }
    .badge.draft  { background:#fef3c7; color:#d97706; }
    .badge.final  { background:#dcfce7; color:#16a34a; }

    .filter-bar { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem; }
    .inp { padding:.55rem .85rem; border:1.5px solid var(--border); border-radius:9px; font-size:.875rem; color:var(--text); outline:none; transition:border-color .2s; background:white; }
    .inp:focus { border-color:var(--primary); }
    .inp-sm { padding:.45rem .75rem; font-size:.82rem; }
    .inp-full { width:100%; }

    .btn-primary { display:inline-flex; align-items:center; gap:.4rem; padding:.6rem 1.1rem; background:var(--primary); color:white; border:none; border-radius:9px; font-size:.875rem; font-weight:600; cursor:pointer; transition:opacity .2s; }
    .btn-primary:hover { opacity:.9; }
    .btn-secondary { display:inline-flex; align-items:center; gap:.4rem; padding:.55rem 1rem; background:white; color:var(--text); border:1.5px solid var(--border); border-radius:9px; font-size:.82rem; font-weight:600; cursor:pointer; transition:all .15s; }
    .btn-secondary:hover { border-color:var(--primary); color:var(--primary); }
    .btn-sm { padding:.3rem .7rem; font-size:.75rem; border-radius:7px; border:1px solid var(--border); background:white; cursor:pointer; transition:all .15s; white-space:nowrap; }
    .btn-sm:hover { border-color:var(--primary); color:var(--primary); }
    .btn-danger { color:#dc2626; border-color:#fca5a5; }
    .btn-danger:hover { background:#fee2e2; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; place-items:center; z-index:1000; padding:1rem; overflow-y:auto; }
    .modal-overlay.open { display:grid; }
    .modal { background:white; border-radius:var(--radius); width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,.15); overflow:hidden; }
    .modal-lg { max-width:780px; }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:1.1rem 1.4rem; border-bottom:1px solid var(--border); }
    .modal-head h3 { font-size:1rem; font-weight:700; }
    .modal-close { background:none; border:none; font-size:1.25rem; cursor:pointer; color:var(--muted); }
    .modal-body { padding:1.4rem; max-height:70vh; overflow-y:auto; }
    .modal-foot { padding:.9rem 1.4rem; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:.6rem; }

    .fg { margin-bottom:.9rem; }
    .fg label { display:block; font-size:.78rem; font-weight:600; color:var(--muted); margin-bottom:.35rem; }
    .inp-row { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }

    /* SLIP GAJI LAYOUT */
    .slip-wrap { font-size:.875rem; position:relative; }
    /* Watermark logo. Pola disamakan dengan .surat-wm di karyawan.html: yang
       diposisikan adalah WADAH-nya (inset:0 + place-items:center), bukan
       gambarnya. Dengan begitu saat dicetak wadah tinggal dijadikan
       position:fixed supaya terulang & selalu di tengah TIAP halaman.
       Versi lama memposisikan <img> sendiri dengan top/left:50% terhadap
       .slip-wrap — itu titik tengah seluruh isi slip, bukan tengah kertas,
       jadi watermark meleset dan cuma tergambar sekali. */
    .slip-watermark { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; z-index:0; }
    .slip-watermark img { width:62%; max-width:330px; opacity:.05; }
    .slip-wrap > *:not(.slip-watermark) { position:relative; z-index:1; }
    .slip-header { display:flex; flex-direction:column; align-items:center; text-align:center; gap:.45rem; padding-bottom:.85rem; border-bottom:2px solid var(--primary-dk); margin-bottom:.25rem; }
    .slip-logo { width:64px; height:64px; object-fit:contain; }
    .slip-kop { width:100%; }
    .slip-header h2 { font-size:1.15rem; font-weight:800; color:var(--primary-dk); letter-spacing:.3px; }
    .slip-header p { font-size:.78rem; color:var(--muted); margin-top:2px; }
    .slip-doc-title { text-align:center; font-weight:700; font-size:.95rem; letter-spacing:1px; margin:.6rem 0 1rem; color:var(--text); }
    .slip-info { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-bottom:1rem; font-size:.82rem; }
    .slip-info-row { display:flex; gap:.5rem; }
    .slip-info-lbl { color:var(--muted); min-width:120px; }
    .slip-section { margin-bottom:1rem; }
    .slip-section-title { font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:.3rem; margin-bottom:.5rem; }
    .slip-row { display:flex; justify-content:space-between; padding:.3rem 0; font-size:.82rem; }
    .slip-row.total { font-weight:700; border-top:1px solid var(--border); padding-top:.5rem; margin-top:.25rem; }
    .slip-takehome { background:#fff; color:var(--navy); border:2px solid var(--navy); border-radius:10px; padding:.85rem 1rem; display:flex; justify-content:space-between; align-items:center; margin-top:1rem; }
    .slip-takehome-lbl { font-size:.82rem; font-weight:600; }
    .slip-takehome-val { font-size:1.2rem; font-weight:800; }
    .slip-sign { width:340px; margin:1.5rem 0 0 auto; text-align:center; }
    .slip-sign p { font-size:.8rem; margin:0; color:var(--text); }
    .slip-sign-area { position:relative; height:240px; margin:.15rem 0; }
    .slip-stamp { position:absolute; left:33%; top:52%; transform:translate(-50%,-50%) rotate(-8deg); height:173px; opacity:.9; }
    .slip-ttd { position:absolute; left:60%; top:46%; transform:translate(-50%,-50%); height:192px; }
    .slip-sign-name { font-weight:700; text-decoration:underline; margin-top:.25rem; }
    .slip-sign-title { color:var(--muted); font-size:.74rem; }
    .slip-footer { text-align:center; font-size:.72rem; color:var(--muted); margin-top:1rem; padding-top:.75rem; border-top:1px solid var(--border); }

    /* PERIODE LIST */
    .periode-item { border:1px solid var(--border); border-radius:10px; padding:1rem 1.25rem; display:flex; align-items:center; justify-content:space-between; margin-bottom:.75rem; transition:all .15s; cursor:pointer; }
    .periode-item:hover { border-color:var(--primary); background:#fafafa; }
    .periode-item:last-child { margin-bottom:0; }
    .periode-name { font-weight:700; font-size:.95rem; }
    .periode-meta { font-size:.78rem; color:var(--muted); margin-top:.2rem; }

    /* SALDO KOMPONEN */
    .komp-item { display:flex; align-items:center; gap:.75rem; padding:.6rem 0; border-bottom:1px solid var(--border); }
    .komp-item:last-child { border-bottom:none; }
    .komp-name { flex:1; font-size:.875rem; }
    .komp-tipe { font-size:.72rem; padding:2px 8px; border-radius:6px; font-weight:600; }
    .tipe-t { background:#dcfce7; color:#16a34a; }
    .tipe-p { background:#fee2e2; color:#dc2626; }

    #toast { position:fixed; bottom:1.5rem; right:1.5rem; padding:.75rem 1.25rem; border-radius:10px; font-size:.875rem; font-weight:500; color:white; z-index:9999; display:none; box-shadow:0 8px 24px rgba(0,0,0,.12); }
    #toast.success { background:#16a34a; }
    #toast.error   { background:#dc2626; }
    #lo { position:fixed; inset:0; background:white; display:grid; place-items:center; z-index:9999; }
    .spin { width:36px; height:36px; border:3px solid #e2e8f0; border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 1rem; }
    @keyframes spin { to{transform:rotate(360deg)} }

    @media print {
      * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
      /* PENTING: pakai display:none, bukan visibility:hidden. visibility hanya
         menyembunyikan tampilan tapi elemennya TETAP memakan tinggi halaman —
         itu yang dulu menghasilkan halaman-halaman kosong di akhir cetakan
         (isi halaman Payroll tetap "ada" walau tak terlihat). Perbaikan yang
         sama sudah lebih dulu dipakai di karyawan.html. */
      body > * { display:none !important; }
      /* Saat mencetak, lebar A4 < 768px sehingga @media(max-width:768px) di
         hris.css ikut aktif. Aturan di sana seperti `.bottom-nav{display:flex
         !important}` mengalahkan `body > *` (specificity lebih tinggi), jadi
         elemen chrome disebut eksplisit dengan selector yang lebih kuat. */
      body > .bottom-nav, body > .sidebar, body > .sidebar-overlay,
      body > .main-wrap, body > #toast, body > #lo { display:none !important; }
      /* Hanya modal yang SEDANG TERBUKA yang dicetak. Sebelumnya #modalSlip &
         #modalBupot dua-duanya dipaksa tampil, jadi mencetak slip ikut
         menyeret kerangka modal bukti potong — sumber halaman kosong lainnya. */
      body > .modal-overlay.open {
        display:block !important; position:static !important;
        background:none !important; padding:0 !important;
        overflow:visible !important; height:auto !important;
      }
      .modal-overlay.open .modal {
        position:static !important; max-width:none !important; width:auto !important;
        max-height:none !important; height:auto !important; margin:0 !important;
        box-shadow:none !important; border-radius:0 !important; overflow:visible !important;
      }
      .modal-overlay.open .modal-head, .modal-overlay.open .modal-foot,
      #bupotForm { display:none !important; }
      /* hris.css versi HP mematok .modal-body ke max-height:62vh — selector di
         sini sengaja lebih spesifik supaya isi surat tak terpotong saat dicetak. */
      .modal-overlay.open .modal-body {
        max-height:none !important; height:auto !important; overflow:visible !important;
      }
      #printArea, #printBupot { padding:1.5rem !important; }
      /* Latar dibuat putih & tinggi dibebaskan supaya tak ada blok abu-abu
         sisa panel yang ikut tercetak di halaman terakhir. */
      body, .modal-overlay.open, .modal-overlay.open .modal,
      .modal-overlay.open .modal-body { background:#fff !important; min-height:0 !important; }
      /* position:fixed membuat elemen ini digambar ulang di SETIAP halaman
         cetak, jadi watermark muncul di semua lembar — dan karena patokannya
         jadi kotak halaman (bukan tinggi isi slip), letaknya selalu pas di
         tengah kertas. Sama seperti .surat-wm di karyawan.html. */
      .slip-watermark { position:fixed !important; inset:0 !important; }
      /* Ukuran TTD & stempel dikunci dalam px (satuan absolut) supaya identik
         di layar maupun di kertas. */
      .slip-sign-area { height:240px !important; }
      .slip-ttd   { height:192px !important; }
      .slip-stamp { height:173px !important; }
    }
  </style>
  <link rel="stylesheet" href="hris.css">
  <link rel="stylesheet" href="theme.css">
  <script src="seasonal-theme.js"></script>
</head>

<div class="modal-overlay" id="modalPeriode">
  <div class="modal">
    <div class="modal-head"><h3><svg class="ic" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg> Buat Periode Payroll</h3><button class="modal-close" onclick="cm('modalPeriode')">×</button></div>

  BPJS_KES_MAX_GAJI:    12000000,

const IDR = v => 'Rp ' + Math.round(v).toLocaleString('id-ID')

// ============================================================
// KALKULASI PPh 21 (Metode Progresif Tahunan)
// ============================================================
function hitungPPh21Bulanan(gajiPokok, totalTunjangan, bpjsKesK, bpjsJhtK, bpjsJpK, statusPtkp) {
  const brutoSetahun = (gajiPokok + totalTunjangan) * 12
  const biayaJabatanBulan = Math.min(gajiPokok * TARIF.BIAYA_JABATAN_PCT, TARIF.BIAYA_JABATAN_MAX)
  const biayaJabatanSetahun = biayaJabatanBulan * 12
  const bpjsSetahun = (bpjsKesK + bpjsJhtK + bpjsJpK) * 12
  const nettoSetahun = brutoSetahun - biayaJabatanSetahun - bpjsSetahun
  const ptkp = TARIF.PTKP[statusPtkp] || TARIF.PTKP['TK/0']
  const pkp = Math.max(0, Math.floor((nettoSetahun - ptkp) / 1000) * 1000)

  let pph = 0
  if (pkp <= 60000000)          pph = pkp * 0.05
  else if (pkp <= 250000000)    pph = 60000000*0.05 + (pkp-60000000)*0.15
  else if (pkp <= 500000000)    pph = 60000000*0.05 + 190000000*0.15 + (pkp-250000000)*0.25
  else if (pkp <= 5000000000)   pph = 60000000*0.05 + 190000000*0.15 + 250000000*0.25 + (pkp-500000000)*0.30
  else                          pph = 60000000*0.05 + 190000000*0.15 + 250000000*0.25 + 4500000000*0.30 + (pkp-5000000000)*0.35

  return { pphBulanan: Math.round(pph/12), nettoSetahun, ptkp, pkp }
}

// ============================================================
// HITUNG SLIP SATU KARYAWAN
// ============================================================
function hitungSlip(karyawan, komponenKaryawan, jamKerja, manual) {
  // === GAJI PER-JAM (freelance) — dibayar bersih, tanpa potongan BPJS/PPh ===
  if (karyawan.tipe_gaji === 'per_jam') {
    const tarif = parseFloat(karyawan.tarif_per_jam) || 0
    const jam   = Math.round((jamKerja || 0) * 100) / 100
    const total = Math.round(jam * tarif)
    return {
      gaji_pokok: 0, total_tunjangan: total,
      detail_tunjangan: [{ nama: `Upah ${jam} jam × ${IDR(tarif)}/jam`, nilai: total, kena_pajak: false }],
      detail_potongan: [],
      bpjs_kes_karyawan: 0, bpjs_jht_karyawan: 0, bpjs_jp_karyawan: 0,
      bpjs_kes_perusahaan: 0, bpjs_jht_perusahaan: 0, bpjs_jp_perusahaan: 0,
      pph21: 0, total_potongan_lain: 0,
      total_pendapatan: total, total_potongan: 0, gaji_bersih: total,
      status_ptkp: karyawan.status_ptkp || 'TK/0', penghasilan_netto_setahun: 0, ptkp: 0, pkp: 0,
      // Gaji per-jam memang dibayar bersih — angka manual BPJS/PPh21 sengaja
      // TIDAK diterapkan di sini agar aturan lama tidak berubah diam-diam.
      potongan_manual: {}
    }
  }

  const gajiPokok = parseFloat(karyawan.gaji_pokok) || 0
  const statusPtkp = karyawan.status_ptkp || 'TK/0'

  // Tunjangan & potongan dari komponen
  let totalTunjanganKenaPajak = 0, totalTunjanganBebasPajak = 0
  let totalPotonganLain = 0
  const detailTunjangan = [], detailPotongan = []

  komponenKaryawan.forEach(kk => {
    const k = allKomponen.find(k => k.id === kk.komponen_id)
    if (!k || !k.aktif) return
    const nilai = parseFloat(kk.nilai) || 0
    if (k.tipe === 'tunjangan') {
      if (k.kena_pajak) totalTunjanganKenaPajak += nilai
      else totalTunjanganBebasPajak += nilai
      detailTunjangan.push({ nama: k.nama, nilai, kena_pajak: k.kena_pajak })
    } else {
      totalPotonganLain += nilai
      detailPotongan.push({ nama: k.nama, nilai })
    }
  })

  const totalTunjangan = totalTunjanganKenaPajak + totalTunjanganBebasPajak
  const totalPendapatan = gajiPokok + totalTunjangan

  // BPJS & PPh 21 (fase19). Aturannya PER BARIS, bukan per kelompok:
  // nilai manual KOSONG/NULL -> hitung otomatis dari tarif seperti biasa;
  // nilai manual TERISI (termasuk 0) -> pakai angka itu. Jadi HR bisa
  // menetapkan yang sudah diketahui saja, sisanya tetap otomatis.
  // Angka manual tetap masuk ke kolom yang sama, supaya slip & Bukti Potong
  // 1721-A1 tidak berubah bentuknya.
  const m = manual || {}
  const manualFlags = {}
  const pakai = (kolom, otomatis) => {
    const v = m[kolom]
    if (v === null || v === undefined || v === '') return Math.round(otomatis)
    manualFlags[kolom] = true
    return Math.round(parseFloat(v) || 0)
  }

  const gajiCapKes = Math.min(gajiPokok, TARIF.BPJS_KES_MAX_GAJI)
  const gajiCapJp  = Math.min(gajiPokok, TARIF.BPJS_JP_MAX_GAJI)

  const bpjsKesK = pakai('bpjs_kes_karyawan', gajiCapKes * TARIF.BPJS_KES_KARYAWAN)
  const bpjsJhtK = pakai('bpjs_jht_karyawan', gajiPokok  * TARIF.BPJS_JHT_KARYAWAN)
  const bpjsJpK  = pakai('bpjs_jp_karyawan',  gajiCapJp  * TARIF.BPJS_JP_KARYAWAN)

  const bpjsKesP = pakai('bpjs_kes_perusahaan', gajiCapKes * TARIF.BPJS_KES_PERUSAHAAN)
  const bpjsJhtP = pakai('bpjs_jht_perusahaan', gajiPokok  * TARIF.BPJS_JHT_PERUSAHAAN)
  const bpjsJpP  = pakai('bpjs_jp_perusahaan',  gajiCapJp  * TARIF.BPJS_JP_PERUSAHAAN)

  // PPh 21. Perhitungan otomatis tetap dijalankan walau nilainya nanti
  // ditimpa manual, karena netto setahun/PTKP/PKP masih dipakai sebagai
  // catatan di slip. Perhatikan: BPJS yang dipakai sebagai pengurang adalah
  // yang BERLAKU — jadi bila BPJS ditetapkan manual, PPh21 otomatis ikut
  // menyesuaikan dengan angka itu.
  const { pphBulanan: pphOtomatis, nettoSetahun, ptkp, pkp } = hitungPPh21Bulanan(
    gajiPokok, totalTunjanganKenaPajak, bpjsKesK, bpjsJhtK, bpjsJpK, statusPtkp
  )
  const pphBulanan = pakai('pph21', pphOtomatis)

  const totalPotongan = bpjsKesK + bpjsJhtK + bpjsJpK + pphBulanan + totalPotonganLain
  const gajiBersih    = totalPendapatan - totalPotongan

  return {
    gaji_pokok: gajiPokok, total_tunjangan: totalTunjangan,
    detail_tunjangan: detailTunjangan, detail_potongan: detailPotongan,
    bpjs_kes_karyawan: bpjsKesK, bpjs_jht_karyawan: bpjsJhtK, bpjs_jp_karyawan: bpjsJpK,
    bpjs_kes_perusahaan: bpjsKesP, bpjs_jht_perusahaan: bpjsJhtP, bpjs_jp_perusahaan: bpjsJpP,
    pph21: pphBulanan, total_potongan_lain: totalPotonganLain,
    total_pendapatan: totalPendapatan, total_potongan: totalPotongan, gaji_bersih: gajiBersih,
    status_ptkp: statusPtkp, penghasilan_netto_setahun: nettoSetahun, ptkp, pkp,
    // Dicatat DI SLIP supaya slip lama tetap tampil apa adanya walau
    // angka manual karyawan ini nanti diisi/diubah.
    potongan_manual: manualFlags
  }
}

// ============================================================
// VIEW HR ADMIN
// ============================================================
// BUKTI POTONG PPh 21 TAHUNAN (Form 1721-A1)
// ============================================================
// Direkap dari slip bulanan yang SUDAH terbit sepanjang tahun. Angka bruto,
// BPJS, dan PPh21 yang dipotong diambil apa adanya dari slip; PPh21 terutang
// dihitung ulang atas dasar penghasilan setahun. Selisih keduanya ditampilkan
// karena itulah yang perlu diselesaikan di akhir tahun (kurang/lebih potong)
// -- terutama bila gaji berubah di tengah tahun.
function pphProgresif (pkp) {
  if (pkp <= 60000000)        return pkp * 0.05
  if (pkp <= 250000000)       return 60000000*0.05 + (pkp-60000000)*0.15
  if (pkp <= 500000000)       return 60000000*0.05 + 190000000*0.15 + (pkp-250000000)*0.25
  if (pkp <= 5000000000)      return 60000000*0.05 + 190000000*0.15 + 250000000*0.25 + (pkp-500000000)*0.30
  return 60000000*0.05 + 190000000*0.15 + 250000000*0.25 + 4500000000*0.30 + (pkp-5000000000)*0.35
}

async function buildBupot () {
  const area = document.getElementById('printBupot')
  const tahun = parseInt(document.getElementById('bupotTahun').value, 10)
  const idKar = document.getElementById('bupotKaryawan').value
  const k = (window.__bupotKar || []).find(x => x.id === idKar)
  if (!k || !tahun) { area.innerHTML = ''; return }

  area.innerHTML = '<p style="font-size:.85rem;color:var(--muted);">Menghitung…</p>'

  // Ambil semua slip milik karyawan ini pada tahun terpilih
  const { data: slip, error } = await sb.from('slip_gaji')
    .select('*, payroll_periode!inner(bulan, tahun, status)')
    .eq('karyawan_id', idKar)
    .eq('payroll_periode.tahun', tahun)

  if (error) { area.innerHTML = `<p style="color:#dc2626;font-size:.85rem;">Gagal memuat: ${escHtml(error.message)}</p>`; return }
  if (!slip || !slip.length) {
    area.innerHTML = `<p style="font-size:.85rem;color:var(--muted);">Belum ada slip gaji untuk ${k.nama_lengkap} di tahun ${tahun}.</p>`
    return
  }
  bupotSlip = slip.sort((a, b) => a.payroll_periode.bulan - b.payroll_periode.bulan)

  const jml = f => bupotSlip.reduce((s, x) => s + Number(x[f] || 0), 0)
  const bulanKerja  = bupotSlip.length
  const gajiPokok   = jml('gaji_pokok')
  const tunjangan   = jml('total_tunjangan')
  const bruto       = jml('total_pendapatan')
  const bpjsKes     = jml('bpjs_kes_karyawan')
  const bpjsJht     = jml('bpjs_jht_karyawan')
  const bpjsJp      = jml('bpjs_jp_karyawan')
  const bpjsTotal   = bpjsKes + bpjsJht + bpjsJp
  const pphDipotong = jml('pph21')

  // Biaya jabatan: 5% bruto, dibatasi Rp500.000 per bulan kerja
  const biayaJabatan = Math.min(bruto * TARIF.BIAYA_JABATAN_PCT, TARIF.BIAYA_JABATAN_MAX * bulanKerja)
  const netto = bruto - biayaJabatan - bpjsTotal
  const ptkpStatus = k.status_ptkp || bupotSlip[bupotSlip.length - 1].status_ptkp || 'TK/0'
  const ptkp = TARIF.PTKP[ptkpStatus] || TARIF.PTKP['TK/0']
  const pkp  = Math.max(0, Math.floor((netto - ptkp) / 1000) * 1000)
  const pphTerutang = Math.round(pphProgresif(pkp))
  const selisih = pphTerutang - pphDipotong

  const bulanTerbit = bupotSlip.map(s => BULAN_NAMA[s.payroll_periode.bulan]).join(', ')

    <tr>

      <td style="padding:4px 6px;border:1px solid #999;${tebal ? 'font-weight:700;' : ''}">${label}</td>
      <td style="padding:4px 6px;border:1px solid #999;text-align:right;white-space:nowrap;${tebal ? 'font-weight:700;' : ''}">${IDR(nilai)}</td>
    </tr>`

  area.innerHTML = `
  <div style="font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;color:#000;background:#fff;">
    <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:.5rem;margin-bottom:.8rem;">
      <div style="font-size:13pt;font-weight:700;">BUKTI PEMOTONGAN PAJAK PENGHASILAN PASAL 21</div>
      <div style="font-size:10pt;">Bagi Pegawai Tetap — Formulir 1721-A1</div>
      <div style="font-size:10pt;margin-top:2px;">Masa Pajak: Januari–Desember ${tahun}</div>
    </div>

    <table style="width:100%;font-size:10pt;margin-bottom:.7rem;">
      <tr><td style="width:135px;vertical-align:top;">Pemotong</td><td style="width:10px;">:</td>
          <td>${escHtml(BUPOT_PERUSAHAAN.nama)}<br><span style="font-size:9pt;">${escHtml(BUPOT_PERUSAHAAN.alamat)}</span></td></tr>
    </table>
    <table style="width:100%;font-size:10pt;border-top:1px solid #999;padding-top:.4rem;margin-bottom:.8rem;">
      <tr><td style="width:135px;">Nama Penerima</td><td style="width:10px;">:</td><td>${escHtml(k.nama_lengkap)}</td></tr>
      <tr><td>NPWP</td><td>:</td><td>${escHtml(k.npwp || '-')}</td></tr>
      <tr><td>NIK</td><td>:</td><td>${escHtml(k.nik_ktp || '-')}</td></tr>
      <tr><td>Employee ID</td><td>:</td><td>${escHtml(k.nik || '-')}</td></tr>
      <tr><td>Jabatan</td><td>:</td><td>${escHtml(k.jabatan?.nama || '-')}</td></tr>
      <tr><td>Status PTKP</td><td>:</td><td>${escHtml(ptkpStatus)}</td></tr>

    </table>

    <table style="width:100%;border-collapse:collapse;font-size:10pt;">
      <tr style="background:#e8e8e8;">
        <th style="padding:4px 6px;border:1px solid #999;">No</th>
        <th style="padding:4px 6px;border:1px solid #999;text-align:left;">Uraian</th>

      ${baris(4, 'Biaya Jabatan (5%, maks. Rp500.000/bulan)', biayaJabatan)}
      ${baris(5, 'Iuran BPJS Kesehatan (dibayar pegawai)', bpjsKes)}
      ${baris(6, 'Iuran BPJS JHT (dibayar pegawai)', bpjsJht)}
      ${baris(7, 'Iuran BPJS Jaminan Pensiun (dibayar pegawai)', bpjsJp)}
      ${baris(8, 'JUMLAH PENGURANGAN (4+5+6+7)', biayaJabatan + bpjsTotal, true)}
      ${baris(9, 'JUMLAH PENGHASILAN NETO (3−8)', netto, true)}
      ${baris(10, `Penghasilan Tidak Kena Pajak (PTKP) — ${escHtml(ptkpStatus)}`, ptkp)}
      ${baris(11, 'PENGHASILAN KENA PAJAK (9−10)', pkp, true)}
      ${baris(12, 'PPh Pasal 21 TERUTANG setahun', pphTerutang, true)}
      ${baris(13, 'PPh Pasal 21 yang SUDAH dipotong', pphDipotong)}
      <tr>
        <td style="padding:4px 6px;border:1px solid #999;text-align:center;">14</td>
        <td style="padding:4px 6px;border:1px solid #999;font-weight:700;">

// Identitas pemotong diambil dari tabel `pengaturan`; nilai di bawah dipakai
// sebagai cadangan bila pengaturan belum termuat.
let BUPOT_PERUSAHAAN = { nama:'-', alamat:'-', kota:'-', penandatangan:'-', jabatan:'-' }
let TTD_BUPOT = null     // {nama, jabatan, gambar(dataURL)} — untuk bukti potong
let TTD_SLIP = null      // penandatangan slip gaji
let STEMPEL_SLIP = null  // dataURL stempel perusahaan

// Ambil berkas dari bucket privat 'tanda-tangan' lalu ubah jadi data URL.
// Data URL dipakai (bukan signed URL langsung) supaya gambar pasti ikut
// tercetak — tautan bertenggat bisa kedaluwarsa di tengah proses cetak.
async function ambilGambarPrivat (path) {
  if (!path) return null
  try {
    const { data } = await sb.storage.from('tanda-tangan').createSignedUrl(path, 120)
    if (!data?.signedUrl) return null
    const blob = await (await fetch(data.signedUrl)).blob()
    return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob) })
  } catch (e) { return null }
}

// Penandatangan & stempel untuk slip gaji. Dipanggil sekali sebelum slip
// dirender, jadi tampilan di layar dan hasil cetak memakai data yang sama.
async function muatTtdSlip () {
  if (TTD_SLIP) return
  const { data: P } = await sb.from('pengaturan').select('kunci, nilai')
  const set = Object.fromEntries((P || []).map(r => [r.kunci, r.nilai]))

  // Slip gaji selama ini ditandatangani Board of Director (bukan penandatangan
  // kontrak). Nama itu dipakai sebagai default agar perilaku tak berubah
  // diam-diam; bisa dialihkan lewat pengaturan `penandatangan_slip`.
  const target = set.penandatangan_slip || 'Moammer Bahreza Baharuddin'
  let { data: pt } = await sb.from('penandatangan')
    .select('nama, jabatan, ttd_path').eq('aktif', true).eq('nama', target).limit(1)
  if (!pt || !pt.length) {   // belum terdaftar -> pakai penandatangan ber-TTD pertama
    ;({ data: pt } = await sb.from('penandatangan')
      .select('nama, jabatan, ttd_path').eq('aktif', true)
      .not('ttd_path', 'is', null).order('urutan').limit(1))
  }
  const p = pt && pt[0]
  if (p) TTD_SLIP = { nama: p.nama, jabatan: p.jabatan, gambar: await ambilGambarPrivat(p.ttd_path) }
  STEMPEL_SLIP = await ambilGambarPrivat(set.stempel_path)

  // Fallback ke berkas TTD & stempel lama (ttd-direktur.png, stempel-kma.png)
  // bila belum ada versi privat — ini KEPUTUSAN yang disepakati, bukan sisa
  // sementara. JANGAN hapus kedua berkas itu dari repo: slip akan terbit
  // tanpa tanda tangan/stempel. Catatan yang disadari: keduanya berada di
  // folder publik sehingga bisa diunduh tanpa login. Untuk menutup celah ini,
  // unggah TTD & stempel lewat Data Karyawan > Buat Surat > "Kelola
  // Penandatangan" (bagian "Stempel Perusahaan") — begitu terisi, kode di
  // atas otomatis memakai versi privat, tanpa perlu ubah kode lagi.
  if (!TTD_SLIP) TTD_SLIP = { nama: 'Moammer Bahreza Baharuddin', jabatan: 'Board of Director', gambar: null }
  if (!TTD_SLIP.gambar) TTD_SLIP.gambar = 'ttd-direktur.png'
  if (!STEMPEL_SLIP) STEMPEL_SLIP = 'stempel-kma.png'
}

async function muatIdentitasPemotong () {

  const P = Object.fromEntries((data || []).map(r => [r.kunci, r.nilai]))
  BUPOT_PERUSAHAAN = {

    kota: P.perusahaan_kota || '-', penandatangan: P.penandatangan_nama || '-',

  }

  // Tanda tangan penandatangan aktif pertama. Berkas ada di bucket PRIVAT,

  try {
    const { data: pt } = await sb.from('penandatangan')
      .select('nama, jabatan, ttd_path').eq('aktif', true)
      .not('ttd_path', 'is', null).order('urutan').limit(1)

      TTD_BUPOT = p

// ============================================================
// BUAT PERIODE & GENERATE SLIP
// ============================================================
async function buatPeriode() {
  const bulan  = parseInt(document.getElementById('pBulan').value)
  const tahun  = parseInt(document.getElementById('pTahun').value)
  const catatan = document.getElementById('pCatatan').value.trim()

  // Cek duplikat
  const { data: exists } = await sb.from('payroll_periode')
    .select('id').eq('bulan',bulan).eq('tahun',tahun).single()
  if (exists) { toast(`Periode ${BULAN_NAMA[bulan]} ${tahun} sudah ada`, 'error'); return }

  // Buat periode
  const { data: periode, error } = await sb.from('payroll_periode').insert({
    bulan, tahun, status:'draft', catatan:catatan||null, dibuat_oleh:myProfile.id
  }).select().single()
  if (error) { toast('Gagal buat periode: '+error.message,'error'); return }

  // Generate slip: karyawan aktif yang punya gaji bulanan ATAU tipe gaji per-jam
  const { data: karyawans } = await sb.from('karyawan')
    .select('*').eq('status','aktif').or('gaji_pokok.neq.0,tipe_gaji.eq.per_jam')
  if (!karyawans?.length) {
    toast('Periode dibuat. Tidak ada karyawan aktif dengan gaji.','error')
    cm('modalPeriode'); renderHR(); return
  }

  // Ambil semua komponen karyawan sekaligus
  const { data: semuaKomp } = await sb.from('karyawan_komponen')
    .select('*').in('karyawan_id', karyawans.map(k=>k.id))

  // Angka BPJS/PPh21 manual per karyawan (fase19). Karyawan yang tak punya
  // baris di sini otomatis memakai perhitungan tarif seperti biasa.
  const { data: semuaManual } = await sb.from('karyawan_potongan_manual')
    .select('*').in('karyawan_id', karyawans.map(k=>k.id))
  const manualMap = Object.fromEntries((semuaManual||[]).map(r => [r.karyawan_id, r]))

  // Jam kerja (dari absensi) untuk karyawan bergaji per-jam
  const jamMap = {}
  const perJamIds = karyawans.filter(k=>k.tipe_gaji==='per_jam').map(k=>k.id)
  if (perJamIds.length) {
    const awal  = `${tahun}-${String(bulan).padStart(2,'0')}-01`
    const akhir = `${tahun}-${String(bulan).padStart(2,'0')}-31`
    const { data: abs } = await sb.from('absensi').select('karyawan_id,durasi_kerja_menit')
      .in('karyawan_id', perJamIds).gte('tanggal', awal).lte('tanggal', akhir)
    ;(abs||[]).forEach(a => { jamMap[a.karyawan_id] = (jamMap[a.karyawan_id]||0) + (a.durasi_kerja_menit||0) })
    Object.keys(jamMap).forEach(id => { jamMap[id] = Math.round((jamMap[id]/60)*100)/100 })
  }

  const slips = karyawans.map(k => {
    const kompK = (semuaKomp||[]).filter(kk=>kk.karyawan_id===k.id)
    const slip = hitungSlip(k, kompK, jamMap[k.id]||0, manualMap[k.id])
    return { periode_id: periode.id, karyawan_id: k.id, ...slip }
  })

  const { error: slipErr } = await sb.from('slip_gaji').insert(slips)
  if (slipErr) { toast('Periode dibuat tapi slip gagal: '+slipErr.message,'error'); return }

  toast(`Periode ${BULAN_NAMA[bulan]} ${tahun} dibuat — ${slips.length} slip di-generate`)
  cm('modalPeriode')
  renderHR()
}

async function finalisasi(periodeId) {
  if (!confirm('Finalisasi periode ini? Slip tidak bisa diubah setelah final (bisa dibatalkan lagi).')) return
  const { error } = await sb.from('payroll_periode').update({status:'final'}).eq('id',periodeId)
  if (error) { toast('Gagal: '+error.message,'error'); return }
  toast('Periode berhasil difinalisasi')
  renderHR()
}

async function batalFinalisasi(periodeId) {
  if (!confirm('Batalkan finalisasi? Periode kembali ke status Draft dan slip bisa diubah lagi.')) return
  const { error } = await sb.from('payroll_periode').update({status:'draft'}).eq('id',periodeId)
  if (error) { toast('Gagal: '+error.message,'error'); return }
  toast('Finalisasi dibatalkan — periode kembali Draft')
  renderHR()
}

async function hapusPeriode(id, nama, isFinal) {
  const pesan = isFinal
    ? `Periode "${nama}" berstatus FINAL. Yakin hapus? Semua slip gaji periode ini akan terhapus permanen.`
    : `Hapus periode "${nama}"? Semua slip akan ikut terhapus.`
  if (!confirm(pesan)) return
  const { error } = await sb.from('payroll_periode').delete().eq('id',id)
  if (error) { toast('Gagal hapus: '+error.message,'error'); return }
  toast('Periode dihapus')
  renderHR()
}

async function lihatSlip(slipId) {
  const { data: sl } = await sb.from('slip_gaji')
    .select('*, karyawan:karyawan_id(nama_lengkap,nik,jabatan:jabatan_id(nama),divisi:divisi_id(nama)), periode:periode_id(*)')
    .eq('id',slipId).single()
  if (!sl) return
  // Tanda tangan & stempel disiapkan SEBELUM slip dirender, supaya yang
  // tampil di layar sama persis dengan yang tercetak.
  await muatTtdSlip()

  document.getElementById('slipTitle').textContent =
    `Slip Gaji — ${sl.karyawan?.nama_lengkap} — ${BULAN_NAMA[sl.periode?.bulan]} ${sl.periode?.tahun}`

  const tunjanganRows = (sl.detail_tunjangan||[]).map(t =>
    `<div class="slip-row"><span>${t.nama}</span><span>${IDR(t.nilai)}</span></div>`).join('')
  const potonganLainRows = (sl.detail_potongan||[]).map(p =>
    `<div class="slip-row"><span>${p.nama}</span><span style="color:#dc2626">- ${IDR(p.nilai)}</span></div>`).join('')

  // Label persentase hanya benar bila angkanya memang dihitung dari tarif.
  // Dicek PER BARIS: baris yang ditetapkan manual tidak diberi persentase,
  // supaya slip tidak menyatakan sesuatu yang tidak sesuai dengan angka di
  // sebelahnya. Baris lain yang masih otomatis tetap menampilkan tarifnya.
  const mf  = sl.potongan_manual || {}
  const pct = (kolom, teks) => mf[kolom] ? '' : ` (${teks})`
  const pctKes  = pct('bpjs_kes_karyawan', '1%')
  const pctJht  = pct('bpjs_jht_karyawan', '2%')
  const pctJp   = pct('bpjs_jp_karyawan', '1%')
  const pctKesP = pct('bpjs_kes_perusahaan', '4%')
  const pctJhtP = pct('bpjs_jht_perusahaan', '3.7%')
  const pctJpP  = pct('bpjs_jp_perusahaan', '2%')

  // Rincian netto/PTKP/PKP itu jalan perhitungan otomatis. Bila PPh 21
  // ditetapkan manual, rincian itu TIDAK menghasilkan angka yang tertera —
  // jadi diganti keterangan singkat, bukan dipaksa tampil dan membingungkan.
  const detailPPh = mf.pph21

async function loadKompModal(karyawanId=null) {
  if (karyawanId) editKompKaryawanId = karyawanId
  const kid = editKompKaryawanId

  const { data: existing } = kid
    ? await sb.from('karyawan_komponen').select('*').eq('karyawan_id',kid)
    : { data: [] }

  const { data: manual } = kid
    ? await sb.from('karyawan_potongan_manual').select('*').eq('karyawan_id',kid).maybeSingle()
    : { data: null }

  const selHtml = kid
    ? `<div class="fg" style="margin-bottom:1rem;">
        <label>Karyawan</label>
        <select class="inp inp-full" id="kompKary" onchange="loadKompModal(this.value)">
          ${allKaryawan.map(k=>`<option value="${k.id}"${k.id===kid?' selected':''}>${k.nama_lengkap}</option>`).join('')}
        </select>
      </div>`
    : `<div class="fg" style="margin-bottom:1rem;">
        <label>Pilih Karyawan</label>
        <select class="inp inp-full" id="kompKary" onchange="loadKompModal(this.value)">
          <option value="">— Pilih Karyawan —</option>
          ${allKaryawan.map(k=>`<option value="${k.id}">${k.nama_lengkap}</option>`).join('')}
        </select>
      </div>`

  const kompHtml = allKomponen.map(komp => {
    const ex = existing?.find(e=>e.komponen_id===komp.id)
    // Status kena pajak hanya berlaku untuk TUNJANGAN — potongan tidak pernah
    // dipakai dalam perhitungan PPh 21 (lihat hitungSlip), jadi saklarnya
    // sengaja tidak ditampilkan di baris potongan agar tak menyesatkan.
    const saklarPajak = komp.tipe === 'tunjangan'
      ? `<button type="button" id="pajak-${komp.id}" onclick="ubahKenaPajak('${komp.id}')"
           title="Klik untuk mengubah — berlaku untuk SEMUA karyawan"
           style="${gayaSaklarPajak(komp.kena_pajak)}">${komp.kena_pajak ? 'kena pajak' : 'bebas pajak'}</button>`
      : ''
    return `
      <div class="komp-item">
        <span class="komp-tipe ${komp.tipe==='tunjangan'?'tipe-t':'tipe-p'}">${komp.tipe==='tunjangan'?'↑':'↓'}</span>
        <span class="komp-name">${komp.nama} ${saklarPajak}</span>
        <input type="number" class="inp inp-sm" style="width:140px;text-align:right"
          data-komp="${komp.id}" value="${ex?.nilai||0}" min="0" placeholder="0">
      </div>`
  }).join('')

  document.getElementById('kompBody').innerHTML =
    selHtml + kompHtml + catatanKenaPajak() + blokPotonganManual(kid, manual)
}

// Keterangan saklar "kena pajak". Sengaja menyebut konsekuensinya, karena
// status ini menentukan besar PPh 21 yang dipotong — bukan sekadar label.
function catatanKenaPajak () {
  return `
    <p style="font-size:.72rem;color:var(--muted);margin-top:.7rem;line-height:1.5;">
      Label <b>kena pajak</b>/<b>bebas pajak</b> pada tunjangan bisa diklik untuk diubah, dan
      <b>berlaku untuk semua karyawan</b> (bukan hanya yang sedang dibuka). Tunjangan
      berstatus <i>kena pajak</i> menambah dasar perhitungan PPh 21; kalau diubah jadi
      <i>bebas pajak</i>, PPh 21 yang dipotong menjadi lebih kecil. Bonus dan tunjangan
      jabatan dalam bentuk uang umumnya merupakan objek PPh 21 — sebaiknya pastikan dulu
      ke konsultan pajak sebelum mengubahnya. Slip yang sudah terbit tidak ikut berubah.
    </p>`
}

function gayaSaklarPajak (kenaPajak) {
  return 'font-size:.68rem;font-weight:700;cursor:pointer;border:1px solid;border-radius:5px;padding:1px 6px;' +
    (kenaPajak ? 'color:#b45309;background:#fef3c7;border-color:#fcd34d;'
               : 'color:#475569;background:#f1f5f9;border-color:#cbd5e1;')
}

// Ubah status kena pajak sebuah komponen (master — berlaku semua karyawan).
async function ubahKenaPajak (komponenId) {
  const komp = allKomponen.find(k => k.id === komponenId)
  if (!komp) return
  const jadi = !komp.kena_pajak
  const pesan = jadi
    ? `Jadikan "${komp.nama}" KENA PAJAK untuk SEMUA karyawan?\n\nPPh 21 yang dipotong akan menjadi lebih besar mulai periode berikutnya.`
    : `Jadikan "${komp.nama}" BEBAS PAJAK untuk SEMUA karyawan?\n\nPPh 21 yang dipotong akan menjadi lebih kecil mulai periode berikutnya.\n\nBonus & tunjangan jabatan berupa uang umumnya objek PPh 21 — pastikan ini sesuai arahan konsultan pajak.`
  if (!confirm(pesan)) return

  const { error } = await sb.from('komponen_gaji').update({ kena_pajak: jadi }).eq('id', komponenId)
  if (error) { toast('Gagal mengubah: ' + error.message, 'error'); return }

  komp.kena_pajak = jadi   // segarkan salinan di memori
  // Tombolnya diperbarui DI TEMPAT, bukan memuat ulang seluruh daftar —
  // memuat ulang akan menghapus angka yang sedang diketik tapi belum disimpan.
  const btn = document.getElementById('pajak-' + komponenId)
  if (btn) {
    btn.textContent = jadi ? 'kena pajak' : 'bebas pajak'
    btn.setAttribute('style', gayaSaklarPajak(jadi))
  }
  toast(`"${komp.nama}" kini ${jadi ? 'kena pajak' : 'bebas pajak'}`)
}

// ------------------------------------------------------------
// BPJS & PPh 21 — boleh ditetapkan manual (fase19)
// ------------------------------------------------------------
// Aturannya per baris: DIBIARKAN KOSONG = dihitung otomatis dari tarif;
// DIISI = pakai angka itu. Dengan begitu HR bisa menetapkan yang sudah
// diketahui nominalnya saja, sisanya tetap otomatis dan bisa diisi nanti.
// Nilainya disimpan per karyawan, jadi cukup diisi sekali dan terpakai terus
// di periode-periode berikutnya sampai diubah.
function blokPotonganManual (kid, m) {
  if (!kid) return ''
  const v = m || {}
  // null/undefined tetap dibiarkan kosong — JANGAN diubah jadi 0, karena 0
  // di sini berarti "tetapkan nol", bukan "otomatis".
  const kosong = x => (x === null || x === undefined || x === '')
  const isi = x => kosong(x) ? '' : Math.round(parseFloat(x) || 0)
  const baris = (label, id, nilai, tarif) => {
    const ditetapkan = !kosong(nilai)
    // Baris yang ditetapkan diberi penanda + bingkai beda, supaya HR langsung
    // lihat mana yang tidak lagi mengikuti tarif. Penting untuk nilai 0, yang
    // artinya "nol-kan" (BPJS/pajak jadi nol) dan mudah disalahsangka kosong.
    return `
    <div class="komp-item">
      <span class="komp-name" style="padding-left:.25rem;">${label}
        ${ditetapkan
          ? '<span style="font-size:.68rem;font-weight:700;color:#b45309;background:#fef3c7;padding:1px 6px;border-radius:5px;">ditetapkan</span>'
          : `<span style="font-size:.7rem;color:var(--muted)">(otomatis: ${tarif})</span>`}</span>
      <input type="number" class="inp inp-sm" min="0" placeholder="otomatis"
        style="width:140px;text-align:right;${ditetapkan ? 'border-color:#f59e0b;font-weight:600;' : ''}"
        data-manual="${id}" value="${isi(nilai)}">
    </div>`
  }

  return `
    <div style="margin-top:1.25rem;padding-top:1rem;border-top:2px solid var(--border);">
      <p style="font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:.2rem;">BPJS &amp; PPh 21</p>
      <p style="font-size:.72rem;color:var(--muted);margin-bottom:.8rem;">
        <b>Biarkan kosong</b> = sistem menghitung sendiri dari tarif (perilaku sekarang).
        <b>Diisi</b> = angka Anda yang dipakai, dan tersimpan untuk bulan-bulan berikutnya
        tanpa perlu diisi ulang. Boleh sebagian saja — baris yang masih kosong tetap otomatis.
        <b>Slip yang sudah terbit tidak ikut berubah.</b>
        Perhatikan: mengisi <b>0</b> berarti menetapkan nol (potongan jadi nol), bukan
        otomatis — untuk kembali otomatis, <b>kosongkan</b> isiannya.
      </p>

      <p style="font-size:.72rem;color:var(--muted);margin:.3rem 0 .2rem;">Potongan karyawan</p>
      ${baris('BPJS Kesehatan', 'bpjs_kes_karyawan', v.bpjs_kes_karyawan, '1%')}
      ${baris('BPJS JHT', 'bpjs_jht_karyawan', v.bpjs_jht_karyawan, '2%')}
      ${baris('BPJS JP', 'bpjs_jp_karyawan', v.bpjs_jp_karyawan, '1%')}
      ${baris('PPh 21 per bulan', 'pph21', v.pph21, 'hitung pajak')}

      <p style="font-size:.72rem;color:var(--muted);margin:.6rem 0 .2rem;">Kontribusi perusahaan (informasi di slip, tidak memotong gaji)</p>
      ${baris('BPJS Kesehatan Perusahaan', 'bpjs_kes_perusahaan', v.bpjs_kes_perusahaan, '4%')}
      ${baris('BPJS JHT Perusahaan', 'bpjs_jht_perusahaan', v.bpjs_jht_perusahaan, '3.7%')}
      ${baris('BPJS JP Perusahaan', 'bpjs_jp_perusahaan', v.bpjs_jp_perusahaan, '2%')}

      <p style="font-size:.72rem;color:var(--muted);margin-top:.7rem;">
        Catatan: baris yang Anda isi tampil di slip tanpa label persentase, karena
        angkanya tidak lagi berasal dari tarif itu. Bila PPh 21 diisi, rincian
        Netto/PTKP/PKP di slip diganti keterangan singkat.
      </p>
    </div>`
}

async function saveKomp() {
  const kid = editKompKaryawanId || document.getElementById('kompKary')?.value
  if (!kid) { toast('Pilih karyawan dulu','error'); return }

  const inputs = document.querySelectorAll('#kompBody input[data-komp]')
  const upserts = []
  inputs.forEach(inp => {
    const nilai = parseFloat(inp.value)||0
    upserts.push({ karyawan_id:kid, komponen_id:inp.dataset.komp, nilai })
  })

  const { error } = await sb.from('karyawan_komponen')
    .upsert(upserts, { onConflict:'karyawan_id,komponen_id' })
  if (error) { toast('Gagal simpan: '+error.message,'error'); return }

  // BPJS & PPh 21 (fase19). Isian kosong berarti "hitung otomatis". Angka 0
  // BUKAN kosong: 0 berarti HR sengaja menetapkan nol, jadi keduanya tidak
  // boleh disamakan.
  const manualInputs = document.querySelectorAll('#kompBody input[data-manual]')
  if (manualInputs.length) {
    const nilai = {}
    manualInputs.forEach(inp => {
      const teks = inp.value.trim()
      nilai[inp.dataset.manual] = teks === '' ? null : Math.round(parseFloat(teks) || 0)
    })

    // Kalau SEMUA isian kosong, barisnya dihapus saja — bukan disimpan penuh
    // NULL. Alasannya: "tidak ada baris" = sepenuhnya otomatis, satu keadaan
    // saja, sehingga tak ada baris sisa yang bisa salah tafsir. Ini juga
    // menutup kemungkinan baris tersimpan penuh 0 (yang berarti "tetapkan
    // nol" — BPJS & pajak jadi nol) padahal HR tak pernah mengisi apa pun.
    const adaIsian = Object.values(nilai).some(v => v !== null)
    const { error: eM } = adaIsian
      ? await sb.from('karyawan_potongan_manual')
          .upsert({ karyawan_id: kid, ...nilai, updated_at: new Date().toISOString() },
                  { onConflict: 'karyawan_id' })
      : await sb.from('karyawan_potongan_manual').delete().eq('karyawan_id', kid)
    if (eM) { toast('Gagal simpan BPJS/PPh21: '+eM.message,'error'); return }
  }

  // Jika dipanggil dari detail periode (edit slip), regenerate slip karyawan ini
  const periodeId = document.getElementById('modalKomp')._periodeId
  if (periodeId) {
    await regenerateSlip(kid, periodeId)
    toast('Komponen gaji disimpan & slip diperbarui')
    cm('modalKomp')
    document.getElementById('modalKomp')._periodeId = null
    bukaDetailPeriode(periodeId)
  } else {
    toast('Komponen gaji disimpan')
    cm('modalKomp')
  }
}

// Regenerate slip untuk satu karyawan di satu periode
async function jamKerjaPeriode (karyawanId, bulan, tahun) {
  const awal  = `${tahun}-${String(bulan).padStart(2,'0')}-01`
  const akhir = `${tahun}-${String(bulan).padStart(2,'0')}-31`
  const { data } = await sb.from('absensi').select('durasi_kerja_menit')
    .eq('karyawan_id', karyawanId).gte('tanggal', awal).lte('tanggal', akhir)
  const menit = (data||[]).reduce((s,a)=> s + (a.durasi_kerja_menit||0), 0)
  return Math.round((menit/60)*100)/100
}

async function regenerateSlip(karyawanId, periodeId) {
  const { data: k } = await sb.from('karyawan').select('*').eq('id', karyawanId).single()
  if (!k) return

  const { data: kompK } = await sb.from('karyawan_komponen').select('*').eq('karyawan_id', karyawanId)
  const { data: man } = await sb.from('karyawan_potongan_manual')
    .select('*').eq('karyawan_id', karyawanId).maybeSingle()
  let jam = 0
  if (k.tipe_gaji === 'per_jam') {
    const { data: per } = await sb.from('payroll_periode').select('bulan,tahun').eq('id', periodeId).single()
    if (per) jam = await jamKerjaPeriode(karyawanId, per.bulan, per.tahun)
  }
  const slip = hitungSlip(k, kompK || [], jam, man)

  const { error } = await sb.from('slip_gaji')
    .update(slip)
    .eq('periode_id', periodeId)
    .eq('karyawan_id', karyawanId)

  if (error) toast('Slip gagal diperbarui: '+error.message, 'error')
}

  if (!session) { window.location.href='index.html'; return }

  const [{ data:k },{ data:karys },{ data:komps }] = await Promise.all([
    sb.from('karyawan').select('*').eq('id',session.user.id).single(),
    sb.from('karyawan').select('id,nama_lengkap,nik,gaji_pokok,status_ptkp,jabatan_id,divisi_id').eq('status','aktif').order('nama_lengkap'),
    sb.from('komponen_gaji').select('*').eq('aktif',true).order('tipe').order('nama')
  ])

  myProfile    = k
  if (!(await guardKaryawanAktif(sb, k?.status))) return
  if (typeof notifPermissionGranted === 'function' && notifPermissionGranted()) startNotifListener(sb, k?.id)
  allKaryawan  = karys || []
  allKomponen  = komps || []

  document.getElementById('sbName').textContent = k.nama_lengkap
  document.getElementById('sbRole').textContent = k.role==='hr_admin'?'HR Admin':'Karyawan'
  if (k.role === 'hr_admin') ['adminNavLbl','navLokasi','navLaporan'].forEach(function(id){var el=document.getElementById(id); if(el) el.style.display=''})
  document.getElementById('sbAv').innerHTML = k.foto_url ? `<img src="${k.foto_url}" alt="">` : (k.nama_lengkap?.charAt(0).toUpperCase()||'?')

  // Set bulan default di modal periode ke bulan sekarang
  document.getElementById('pBulan').value = new Date().getMonth()+1

  await renderPage()
  document.getElementById('lo').style.display = 'none'
}
